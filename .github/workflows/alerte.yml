name: Alerte tournois padel

on:
  schedule:
    - cron: "0 5,15 * * *"   # 2 fois par jour (heure UTC)
  workflow_dispatch:          # permet de le lancer à la main

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python alerte_padel.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Sauvegarder les tournois déjà vus
        run: |
          git config user.name "alerte-bot"
          git config user.email "alerte-bot@users.noreply.github.com"
          git add seen.json geocache.json
          git diff --cached --quiet || (git commit -m "maj etat" && git push)
